<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動画で見る｜理科因果ノート｜琴見由弘</title>
  <meta name="description" content="『理科因果ノート』の問いを、原因から結果まで一段ずつ説明するショート動画。単元ごとに並べています。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="動画で見る｜理科因果ノート">
  <meta property="og:description" content="理科の「なぜ？」を、原因から結果まで一段ずつ説明するショート動画を、単元ごとに。">
  <meta property="og:url" content="https://kotomiyoshihiro.com/videos/">
  <meta property="og:image" content="https://kotomiyoshihiro.com/rika-inga-note-cover.png">
  <link rel="canonical" href="https://kotomiyoshihiro.com/videos/">
  <meta name="theme-color" content="#f7f5f0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314242c'/%3E%3Ccircle cx='19' cy='32' r='5.5' fill='%23e2703a'/%3E%3Cline x1='25' y1='32' x2='35' y2='32' stroke='%23f4efe3' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='32' r='9.5' fill='none' stroke='%23f4efe3' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* トップページ(../index.html)と同じ色と文字 */
    :root {
      --paper: #f7f5f0;
      --ink: #1a1d1f;
      --sub: #6b6f70;
      --faint: #9a9d9c;
      --rule: #dcd8ce;
      --navy: #14242c;
      --cream: #f4efe3;
      --orange: #e2703a;
      --serif: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
      --sans: "Zen Kaku Gothic New", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      --latin: "Cormorant Garamond", Georgia, serif;
      --wrap: min(1080px, calc(100% - 64px));
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; scroll-padding-top: 80px; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 2;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "palt";
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }
    p { margin: 0; }

    /* ヘッダー */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 245, 240, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: var(--wrap);
      margin: 0 auto;
      padding: 22px 0;
    }

    .brand {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2em;
    }

    .nav {
      display: flex;
      gap: 36px;
      font-size: 13px;
      color: var(--sub);
    }

    .nav a { transition: color 0.3s; }
    .nav a:hover { color: var(--ink); }

    .link {
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 1px solid currentColor;
      font-size: 13px;
      letter-spacing: 0.12em;
      transition: opacity 0.3s;
    }

    .link:hover { opacity: 0.55; }

    /* ページの頭 */
    .intro {
      width: var(--wrap);
      margin: 0 auto;
      padding: 88px 0 64px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      color: var(--sub);
      font-size: 12px;
      letter-spacing: 0.3em;
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--orange);
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.14em;
    }

    .lead {
      max-width: 34em;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--rule);
      color: var(--sub);
      line-height: 2.1;
    }

    .lead + .lead { margin-top: 8px; padding-top: 0; border-top: 0; }

    .buy {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px 24px;
      margin-top: 40px;
    }

    .button-amazon {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 16px 28px;
      background: var(--orange);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.16em;
      transition: background 0.3s;
    }

    .button-amazon:hover { background: #cc5f2c; }

    .buy-note {
      color: var(--sub);
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    /* 単元への目次 */
    .units {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 48px 0 0;
      padding: 0;
      list-style: none;
    }

    .units a {
      display: inline-block;
      padding: 4px 14px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: #fff;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.9;
      transition: border-color 0.3s, color 0.3s;
    }

    .units a:hover { border-color: var(--ink); color: var(--ink); }
    .units small { margin-left: 6px; color: var(--faint); font-size: 11px; }

    /* 単元ごとの並び */
    .unit {
      width: var(--wrap);
      margin: 0 auto;
      padding: 56px 0 64px;
      border-top: 1px solid var(--rule);
    }

    .unit-head {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 28px;
    }

    h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.12em;
    }

    .unit-count {
      color: var(--faint);
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 40px 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .frame {
      position: relative;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: var(--navy);
      box-shadow: 0 20px 40px -24px rgba(20, 36, 44, 0.55);
    }

    .play {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .play img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .play:hover img { transform: scale(1.02); }

    .play-mark {
      position: absolute;
      left: 50%;
      bottom: 14px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      border-radius: 50%;
      background: rgba(20, 36, 44, 0.78);
    }

    .play-mark::before {
      content: "";
      margin-left: 4px;
      border-style: solid;
      border-width: 8px 0 8px 13px;
      border-color: transparent transparent transparent #fff;
    }

    .play:hover .play-mark { background: var(--orange); }

    /* サムネイルが取れなかったとき */
    .no-thumb {
      position: absolute;
      inset: 0;
      display: none;
      padding: 24px 16px;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.8;
      text-align: left;
    }

    .frame.is-missing .no-thumb { display: block; }
    .frame.is-missing img { visibility: hidden; }

    .frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .card-num {
      display: block;
      margin-top: 14px;
      color: var(--faint);
      font-family: var(--latin);
      font-size: 14px;
      letter-spacing: 0.1em;
      line-height: 1.4;
      font-variant-numeric: lining-nums;
    }

    .card-q {
      display: block;
      margin-top: 4px;
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.8;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }

    .message {
      width: var(--wrap);
      margin: 0 auto;
      padding: 40px 0;
      color: var(--sub);
    }

    .message a { border-bottom: 1px solid currentColor; }

    /* いちばん下 */
    .outro {
      width: var(--wrap);
      margin: 0 auto;
      padding: 56px 0 80px;
      border-top: 1px solid var(--rule);
    }

    .outro-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 40px;
      margin-top: 32px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      width: var(--wrap);
      margin: 0 auto;
      padding: 40px 0 48px;
      border-top: 1px solid var(--rule);
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.2em;
    }

    .footer a:hover { color: var(--ink); }

    a:focus-visible, .play:focus-visible { outline: 1px solid var(--orange); outline-offset: 6px; }

    @media (max-width: 900px) {
      :root { --wrap: calc(100% - 40px); }

      .topbar-inner { padding: 16px 0; }
      .nav { gap: 20px; font-size: 12px; }

      .intro { padding: 56px 0 48px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 16px; }
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
      .unit { padding: 44px 0 48px; }
      h2 { font-size: 19px; }
      .card-q { font-size: 13px; }
      .units a { font-size: 12px; padding: 3px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../">琴見由弘</a>
      <nav class="nav" aria-label="主要リンク">
        <a href="../#book">理科因果ノート</a>
        <a href="../">トップ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">理科因果ノート</p>
      <h1 id="page-title">動画で見る</h1>
      <p class="lead">本に収めた理科の「なぜ？」を、原因から結果まで一段ずつ説明するショート動画です。単元ごとに並べました。</p>
      <p class="lead">画像を押すと、このページの中で再生します。問いが出たら、答えを見る前にひとこと言えるか試してみてください。</p>

      <div class="buy">
        <a class="button-amazon" href="https://www.amazon.co.jp/dp/B0HJ6V96M6">Amazonで本を見る <span aria-hidden="true">→</span></a>
        <p class="buy-note">150問の本です。Amazonで販売中。</p>
      </div>

      <ul class="units" id="unit-index" aria-label="単元"></ul>
    </section>

    <div id="list" aria-live="polite"></div>

    <noscript>
      <p class="message">この一覧は JavaScript で表示しています。動画は <a href="https://www.youtube.com/@kotomiyoshihiro/shorts">YouTube のチャンネル</a>でも見られます。</p>
    </noscript>

    <section class="outro" aria-label="本と、ほかの見方">
      <a class="button-amazon" href="https://www.amazon.co.jp/dp/B0HJ6V96M6">Amazonで本を見る <span aria-hidden="true">→</span></a>
      <div class="outro-links">
        <a class="link" href="../">トップへ戻る</a>
        <a class="link" href="https://www.youtube.com/@kotomiyoshihiro">YouTube のチャンネル</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 琴見由弘</span>
      <a href="#">TOP ↑</a>
    </div>
  </footer>

  <script>
    // 一覧のデータは videos.json(tools/build_videos.py が予約の記録から作る)。
    // 公開の日時(publishAt、日本時間)を過ぎた動画だけを出す。予約中の動画は出さない。
    (function () {
      var list = document.getElementById("list");
      var index = document.getElementById("unit-index");
      var playing = null; // いま再生している { frame, button }

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function showMessage(text) {
        var p = el("p", "message", text + " ");
        var a = el("a", null, "YouTube のチャンネル");
        a.href = "https://www.youtube.com/@kotomiyoshihiro/shorts";
        p.appendChild(a);
        p.appendChild(document.createTextNode("でも見られます。"));
        list.appendChild(p);
      }

      // サムネイル: sddefault(縦の動画が中央に入った 4:3)→ hqdefault → 文字だけ
      function setThumb(frame, img, id) {
        var tries = ["sddefault", "hqdefault"];
        function next() {
          var v = tries.shift();
          if (!v) { frame.classList.add("is-missing"); return; }
          img.src = "https://i.ytimg.com/vi/" + id + "/" + v + ".jpg";
        }
        img.addEventListener("error", next);
        img.addEventListener("load", function () {
          // 画像がないとき YouTube は 120×90 の灰色の画像を返すことがある
          if (img.naturalWidth <= 120) next();
        });
        next();
      }

      function stop() {
        if (!playing) return;
        var iframe = playing.frame.querySelector("iframe");
        if (iframe) iframe.remove();
        playing.frame.appendChild(playing.button);
        playing = null;
      }

      function play(frame, button, v) {
        stop();
        var iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(v.id) + "?autoplay=1&rel=0&playsinline=1";
        iframe.title = v.title + "(YouTube の動画)";
        iframe.allow = "autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allowFullscreen = true;
        button.remove();
        frame.appendChild(iframe);
        playing = { frame: frame, button: button };
      }

      function card(v) {
        var li = el("li", "card");
        li.id = "v-" + v.id; // トップのリンク(videos/#v-<ID>)の飛び先
        var frame = el("div", "frame");
        var button = el("button", "play");
        button.type = "button";
        button.setAttribute("aria-label", "「" + v.title + "」の動画を再生");
        var img = el("img");
        img.alt = "";
        img.width = 270;
        img.height = 480;
        img.loading = "lazy";
        img.decoding = "async";
        button.appendChild(img);
        button.appendChild(el("span", "no-thumb", v.title));
        button.appendChild(el("span", "play-mark"));
        button.addEventListener("click", function () { play(frame, button, v); });
        frame.appendChild(button);
        setThumb(frame, img, v.id);
        li.appendChild(frame);
        if (v.card) li.appendChild(el("span", "card-num", "No." + v.card));
        li.appendChild(el("span", "card-q", v.title));
        return li;
      }

      function render(data) {
        var now = Date.now();
        var shown = (data.videos || []).filter(function (v) {
          var t = Date.parse(v.publishAt);
          return !isNaN(t) && t <= now;
        });
        if (!shown.length) { showMessage("まだ動画がありません。"); return; }

        (data.units || []).forEach(function (unit, i) {
          var items = shown.filter(function (v) { return v.unit === unit; });
          if (!items.length) return;
          var sid = "unit-" + (i + 1);

          var li = el("li");
          var a = el("a", null, unit);
          a.href = "#" + sid;
          a.appendChild(el("small", null, items.length + "本"));
          li.appendChild(a);
          index.appendChild(li);

          var sec = el("section", "unit");
          sec.id = sid;
          sec.setAttribute("aria-labelledby", sid + "-title");
          var head = el("div", "unit-head");
          var h = el("h2", null, unit);
          h.id = sid + "-title";
          head.appendChild(h);
          head.appendChild(el("span", "unit-count", items.length + "本"));
          sec.appendChild(head);
          var ul = el("ul", "grid");
          items.forEach(function (v) { ul.appendChild(card(v)); });
          sec.appendChild(ul);
          list.appendChild(sec);
        });

        // 一覧はあとから作るので、#v-<ID> や #unit-N へは作ったあとで飛ぶ
        if (location.hash.length > 1) {
          var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (target) {
            // サイトの scroll-behavior: smooth のままだと、読み込み中の動きで止まることがある
            var root = document.documentElement;
            var prev = root.style.scrollBehavior;
            root.style.scrollBehavior = "auto";
            target.scrollIntoView({ block: "start" });
            root.style.scrollBehavior = prev;
          }
        }
      }

      fetch("videos.json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(render)
        .catch(function () { showMessage("一覧を読み込めませんでした。"); });
    })();
  </script>
</body>
</html>
